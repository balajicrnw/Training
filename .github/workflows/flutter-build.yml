name: Flutter Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Go to Flutter project
        run: cd flutter_practice/namma_kadai

      - name: Install dependencies
        run: |
          cd flutter_practice/namma_kadai
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_practice/namma_kadai
          flutter build apk