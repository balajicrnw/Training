services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: serverpod_practice_backend
      POSTGRES_PASSWORD: "s6fIKQE2qumZdBXn4zIPppimjPhRH80E"
    volumes:
      - serverpod_practice_backend_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "XAV_63y8WcjqwJoC-uP5H665QqUuUekV"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: serverpod_practice_backend_test
      POSTGRES_PASSWORD: "tDrz1TixBGWb5MGU4ODanZfMwed41BVW"
    volumes:
      - serverpod_practice_backend_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "OxdIfpctVzCTZSnEES7bOWZrzhvFDSBS"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  serverpod_practice_backend_data:
  serverpod_practice_backend_test_data:
