name: CI Pipeline

# Trigger: run workflow on push or pull request to main
on:
  workflow_dispatch:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # Virtual machine to run workflow
    steps:
      - name: Checkout code
        uses: actions/checkout@v3   # Get repository code

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'        # Use Node.js version 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test