targets:
  $default:
    builders:
      sourcegen_practice:
        generate_for:
          - lib/**.dart

builders:
  sourcegen_practice:
    import: "package:sourcegen_practice/builder.dart"

    builder_factories:
      - "sharedBuilder"

    build_extensions:
      ".dart":
        - ".sourcegen_practice.g.part"

    auto_apply: root_package
    build_to: cache

    applies_builders:
      - source_gen|combining_builder
  