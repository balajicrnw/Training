services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: namma_kadai_backend
      POSTGRES_PASSWORD: "EfeWpm4fEWPFzhBqR8zWdpe8fdbmyYaS"
    volumes:
      - namma_kadai_backend_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "4zvmulRI4scjUPH8TpxEKx5LWhT0E_2F"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: namma_kadai_backend_test
      POSTGRES_PASSWORD: "_0bN-Gkl9jzUabf933YA5g_V8zWVAjGx"
    volumes:
      - namma_kadai_backend_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "LWjpKMxXYZBZ1APOHL4W1yx-Tm1ht1AP"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  namma_kadai_backend_data:
  namma_kadai_backend_test_data:
